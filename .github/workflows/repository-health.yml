name: Repository Health

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure:
    name: Validate repository foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required structure
        shell: bash
        run: |
          set -euo pipefail

          # Only load-bearing paths are enforced. Module folders are created
          # when the module is built, not kept as empty scaffolding.
          required_paths=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "package.json"
            "app"
            "components"
            "lib"
            "services"
            "styles"
            "docs/architecture/repository-architecture.md"
            "docs/architecture/runtime/README.md"
            "docs/decisions/0007-official-runtime-framework.md"
            ".ai/README.md"
            ".ai/agents/README.md"
            "blueprints/_template.md"
            ".github/pull_request_template.md"
          )

          missing=0
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Missing required path: $path"
              missing=1
            fi
          done

          exit "$missing"

  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
